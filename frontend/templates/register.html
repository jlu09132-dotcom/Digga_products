{% extends "base.html" %}
{% block title %}Create Account | Digga{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">Digga</div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Join as a buyer or supplier</p>

    <div class="role-toggle">
      <button class="role-toggle-btn active" id="btnBuyer" type="button">🛒 Buyer</button>
      <button class="role-toggle-btn" id="btnSupplier" type="button">🏭 Supplier</button>
    </div>

    <div id="errorAlert"   class="alert alert-error"   style="display:none"></div>
    <div id="successAlert" class="alert alert-success" style="display:none"></div>

    <form id="registerForm" style="display:flex;flex-direction:column;gap:1rem">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="input-group" style="grid-column:1/-1">
          <label class="input-label">Full Name</label>
          <input type="text" id="name" class="input" placeholder="John Doe" required>
        </div>
        <div class="input-group" style="grid-column:1/-1">
          <label class="input-label">Email Address</label>
          <input type="email" id="email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label class="input-label">Phone</label>
          <input type="tel" id="phone" class="input" placeholder="+91 98765 43210" required>
        </div>
        <div class="input-group" id="shopNameWrap" style="display:none">
          <label class="input-label">Shop Name</label>
          <input type="text" id="shop_name" class="input" placeholder="My Shop">
        </div>
        <div class="input-group" style="grid-column:1/-1">
          <label class="input-label">Address</label>
          <textarea id="address" class="input" rows="2" placeholder="Your full address" style="resize:none"></textarea>
        </div>
        <div class="input-group" style="grid-column:1/-1">
          <label class="input-label">Password</label>
          <input type="password" id="password" class="input" placeholder="Min. 8 characters" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="padding:0.75rem;margin-top:0.25rem">
        Create Account
      </button>
    </form>

    <div class="auth-divider"></div>
    <p class="auth-footer">Already have an account? <a href="/login/">Sign in</a></p>
  </div>
</div>

<script>
  let currentRole = 'buyer';

  document.getElementById('btnBuyer').onclick = () => {
    currentRole = 'buyer';
    document.getElementById('btnBuyer').classList.add('active');
    document.getElementById('btnSupplier').classList.remove('active');
    document.getElementById('shopNameWrap').style.display = 'none';
  };

  document.getElementById('btnSupplier').onclick = () => {
    currentRole = 'supplier';
    document.getElementById('btnSupplier').classList.add('active');
    document.getElementById('btnBuyer').classList.remove('active');
    document.getElementById('shopNameWrap').style.display = '';
  };

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const errDiv = document.getElementById('errorAlert');
    const okDiv  = document.getElementById('successAlert');
    errDiv.style.display = 'none';
    okDiv.style.display  = 'none';
    btn.classList.add('loading');
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    const payload = {
      name:     document.getElementById('name').value.trim(),
      email:    document.getElementById('email').value.trim(),
      phone:    document.getElementById('phone').value.trim(),
      address:  document.getElementById('address').value.trim(),
      password: document.getElementById('password').value,
    };
    if (currentRole === 'supplier') {
      payload.shop_name = document.getElementById('shop_name').value.trim();
    }

    const endpoint = currentRole === 'buyer' ? '/api/buyers/' : '/api/suppliers/';
    try {
      const res  = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (res.ok) {
        okDiv.textContent = 'Account created! Redirecting to login…';
        okDiv.style.display = 'flex';
        setTimeout(() => window.location.href = '/login/', 1800);
      } else {
        const msg = data.detail || Object.values(data).flat().join(', ');
        errDiv.textContent = msg;
        errDiv.style.display = 'flex';
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    } catch(err) {
      errDiv.textContent = 'Network error. Please try again.';
      errDiv.style.display = 'flex';
      btn.classList.remove('loading');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
{% endblock %}
