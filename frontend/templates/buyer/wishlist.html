{% extends "base.html" %}
{% block title %}Wishlist | Digga{% endblock %}

{% block content %}
<div class="page-padding">
  <div class="page-header">
    <div>
      <h1 class="page-title">Your Wishlist</h1>
      <p style="color:var(--text-2);margin-top:0.25rem" id="wishlistCount"></p>
    </div>
    <a href="/products/" class="btn btn-secondary btn-sm">Continue Shopping</a>
  </div>
  <div id="wishlistItems" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/wishlist.js"></script>
<script>
requireAuth();
requireRole('buyer');
loadWishlist();
loadCartCount();
</script>
{% endblock %}
