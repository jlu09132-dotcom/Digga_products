{% extends "base.html" %}
{% block title %}Sign In | Digga{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Digga</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <div id="errorAlert" class="alert alert-error" style="display:none"></div>

    <form id="loginForm" style="display:flex;flex-direction:column;gap:1rem">
      <div class="input-group">
        <label class="input-label">Email Address</label>
        <div class="input-with-icon">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" id="email" class="input" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">Password</label>
        <div class="input-with-icon">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.5rem;padding:0.75rem">
        Sign In
      </button>
    </form>

    <div class="auth-divider"></div>
    <p class="auth-footer">
      Don't have an account? <a href="/register/">Create one free</a>
    </p>
  </div>
</div>

<script>
  if (typeof isAuthenticated !== 'undefined' && isAuthenticated()) {
    const r = getUserRole();
    window.location.href = r === 'buyer' ? '/buyer/dashboard/' : r === 'supplier' ? '/supplier/dashboard/' : r === 'admin' ? '/admin/dashboard/' : '/';
  }

  const form = document.getElementById('loginForm');
  const errDiv = document.getElementById('errorAlert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    btn.classList.add('loading');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    errDiv.style.display = 'none';

    const result = await login(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );

    if (result === true) {
      const r = getUserRole();
      window.location.href = r === 'buyer' ? '/buyer/dashboard/' : r === 'supplier' ? '/supplier/dashboard/' : r === 'admin' ? '/admin/dashboard/' : '/';
    } else {
      errDiv.textContent = result.error || 'Invalid email or password.';
      errDiv.style.display = 'flex';
      btn.classList.remove('loading');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
{% endblock %}
