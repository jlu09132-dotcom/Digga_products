{% extends "base.html" %}
{% block title %}All Products | Digga Admin{% endblock %}

{% block content %}
<div class="page-padding">
  <div class="page-header">
    <div>
      <h1 class="page-title">All Products</h1>
      <p style="color:var(--text-2);margin-top:0.25rem">Moderate product listings on the platform</p>
    </div>
    <div class="search-input-wrap" style="flex:0 1 260px">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="productSearch" class="input" placeholder="Search products…" style="border-radius:999px;padding-left:2.5rem">
    </div>
  </div>
  <div id="productsList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/admin-products.js"></script>
<script>
requireAuth();
requireRole('admin');
loadProducts();

document.getElementById('productSearch').addEventListener('input', function() {
    var q = this.value.toLowerCase();
    document.querySelectorAll('.admin-product-card').forEach(function(card) {
        card.style.display = card.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
});
</script>
{% endblock %}
