{% extends "base.html" %}
{% block title %}My Products | Digga{% endblock %}

{% block content %}
<div class="page-padding">
  <div class="page-header">
    <div>
      <h1 class="page-title">My Products</h1>
      <p style="color:var(--text-2);margin-top:0.25rem" id="productCountLabel"></p>
    </div>
    <button onclick="openAddProductModal()" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Add Product
    </button>
  </div>
  <div id="productsList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem"></div>
</div>

<!-- Product Modal -->
<div id="productModal" class="modal-backdrop hidden">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">Add Product</h3>
      <button class="modal-close" onclick="closeModal('productModal')">✕</button>
    </div>
    <div class="modal-body">
      <form id="productForm" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:1.125rem">
        <input type="hidden" id="productId">
        <div class="input-group">
          <label class="input-label">Product Name</label>
          <input type="text" id="productName" class="input" placeholder="e.g. Portland Cement 50kg" required>
        </div>
        <div class="input-group">
          <label class="input-label">Description</label>
          <textarea id="productDesc" class="input" rows="3" style="resize:none" required></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
          <div class="input-group">
            <label class="input-label">Price (₹)</label>
            <input type="number" id="productPrice" class="input" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="input-group">
            <label class="input-label">Stock Quantity</label>
            <input type="number" id="productStock" class="input" min="0" placeholder="0" required>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">Category</label>
          <select id="productCategory" class="input">
            <option value="">Select category</option>
          </select>
        </div>
        <div class="input-group">
          <label class="input-label">Product Image</label>
          <div class="dropzone" id="imageDropzone" onclick="document.getElementById('productImage').click()">
            <div class="dropzone-icon">📷</div>
            <div class="dropzone-text"><strong>Click to upload</strong> or drag &amp; drop</div>
            <div style="font-size:0.75rem;color:var(--text-3);margin-top:0.375rem">PNG, JPG up to 5MB</div>
            <input type="file" id="productImage" accept="image/*" style="display:none">
          </div>
          <div id="imagePreview" class="img-preview-grid"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal('productModal')" class="btn btn-secondary">Cancel</button>
      <button id="saveProductBtn" onclick="submitProduct()" class="btn btn-primary">Save Product</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/supplier-products.js"></script>
<script>
requireAuth();
requireRole('supplier');
loadSupplierProducts();
loadCategories();

// Drag-drop
(function() {
    var dz = document.getElementById('imageDropzone');
    dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragging'); });
    dz.addEventListener('dragleave', function() { dz.classList.remove('dragging'); });
    dz.addEventListener('drop', function(e) {
        e.preventDefault();
        dz.classList.remove('dragging');
        var file = e.dataTransfer.files[0];
        if (file) {
            var dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById('productImage').files = dt.files;
            previewImage({ files: dt.files });
        }
    });

    document.getElementById('productImage').addEventListener('change', function() {
        previewImage(this);
    });
})();

function previewImage(input) {
    var file = input.files && input.files[0];
    var preview = document.getElementById('imagePreview');
    if (!file) { preview.innerHTML = ''; return; }
    var reader = new FileReader();
    reader.onload = function(e) {
        preview.innerHTML = '<div class="img-preview-item"><img src="' + e.target.result + '" alt="preview"></div>';
    };
    reader.readAsDataURL(file);
}
</script>
{% endblock %}
