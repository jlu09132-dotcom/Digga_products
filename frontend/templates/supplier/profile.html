{% extends "base.html" %}
{% block title %}Supplier Profile | Digga{% endblock %}

{% block content %}
<div class="page-padding" style="max-width:640px;margin:0 auto">
  <div class="page-header">
    <h1 class="page-title">Personal Profile</h1>
  </div>
  <div class="card" style="padding:2rem">
    <div style="display:flex;align-items:center;gap:1.25rem;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
      <div class="user-avatar" style="width:64px;height:64px;font-size:1.5rem" id="profileAvatar">S</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.125rem;font-weight:700" id="profileNameDisplay">—</div>
        <div style="font-size:0.875rem;color:var(--text-2)" id="profileEmailDisplay">—</div>
      </div>
    </div>
    <div id="profileAlert" class="alert" style="display:none"></div>
    <form id="supplierProfileForm" style="display:flex;flex-direction:column;gap:1.25rem">
      <div class="input-group">
        <label class="input-label">Full Name</label>
        <input type="text"     id="name"     class="input" required>
      </div>
      <div class="input-group">
        <label class="input-label">Email Address</label>
        <input type="email"    id="email"    class="input" required>
      </div>
      <div class="input-group">
        <label class="input-label">Phone</label>
        <input type="tel"      id="phone"    class="input" required>
      </div>
      <div class="input-group">
        <label class="input-label">Address</label>
        <textarea id="address" class="input" rows="3" style="resize:none"></textarea>
      </div>
      <div class="divider"></div>
      <div class="input-group">
        <label class="input-label">New Password <span style="color:var(--text-3);font-weight:400;text-transform:none">(blank = no change)</span></label>
        <input type="password" id="password" class="input" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="padding:0.75rem">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/supplier-profile.js"></script>
<script>
requireAuth();
requireRole('supplier');
loadSupplierProfile();
</script>
{% endblock %}
